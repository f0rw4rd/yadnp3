# dnp3c configuration for yadnp3's conformance-outstation (cpp/tests/conformance).
# Anything not set here has dnp3c's default; `dnp3c -write` lists every option.

test.output.directory = ./results
test.deviceUnderTest = yadnp3 conformance-outstation

tcp.device.address = 127.0.0.1
tcp.device.port = 20000

link.source = 1
link.destination = 1024
link.num.retry = 3
link.timeout.ms = 1000

outstation.subset.level = 2
outstation.select.timeout.ms = 2000
outstation.response.timeout.ms = 2000
outstation.app.confirm.timeout.ms = 2000
outstation.fragmentSize = 2048

# 20 binary outputs: 0 to 9 each accept one command, 10 to 19 a latch on
binaryOutput.uninstalled.index = 65535
binaryOutput.maxPointsInSingleRequest = 4
binaryOutput.installedPoints = 10 ... 19
binaryOutput.primary.valid.index = 0
binaryOutput.primary.valid.function = 0x03
binaryOutput.primary.valid.count = 1
binaryOutput.primary.valid.onTime.ms = 100
binaryOutput.primary.valid.offTime.ms = 200
binaryOutput.alternate.valid.index = 1
binaryOutput.alternate.valid.function = 0x81
binaryOutput.alternate.valid.count = 5
binaryOutput.alternate.valid.onTime.ms = 300
binaryOutput.alternate.valid.offTime.ms = 400
binaryOutput.latchOnOffPoint.index = 2
binaryOutput.latchOnOffPoint.count = 10
binaryOutput.latchOnOffPoint.onTime.ms = 500
binaryOutput.latchOnOffPoint.offTime.ms = 600
binaryOutput.pulseOnOffPoint.index = 3
binaryOutput.pulseOnOffPoint.count = 15
binaryOutput.pulseOnOffPoint.onTime.ms = 700
binaryOutput.pulseOnOffPoint.offTime.ms = 800
binaryOutput.latchAndPulsePoint.index = 4
binaryOutput.latchAndPulsePoint.count = 20
binaryOutput.latchAndPulsePoint.onTime.ms = 900
binaryOutput.latchAndPulsePoint.offTime.ms = 1000
binaryOutput.singleFunctionPulseOnPoint.index = 5
binaryOutput.singleFunctionPulseOnPoint.count = 25
binaryOutput.singleFunctionPulseOnPoint.onTime.ms = 1100
binaryOutput.singleFunctionPulseOnPoint.offTime.ms = 1200
binaryOutput.singleFunctionLatchOnPoint.index = 6
binaryOutput.singleFunctionLatchOnPoint.count = 30
binaryOutput.singleFunctionLatchOnPoint.onTime.ms = 1300
binaryOutput.singleFunctionLatchOnPoint.offTime.ms = 1400
binaryOutput.singleFunctionLatchOffPoint.index = 7
binaryOutput.singleFunctionLatchOffPoint.count = 35
binaryOutput.singleFunctionLatchOffPoint.onTime.ms = 1500
binaryOutput.singleFunctionLatchOffPoint.offTime.ms = 1600
binaryOutput.singleFunctionPulseOnClosePoint.index = 8
binaryOutput.singleFunctionPulseOnClosePoint.count = 40
binaryOutput.singleFunctionPulseOnClosePoint.onTime.ms = 1700
binaryOutput.singleFunctionPulseOnClosePoint.offTime.ms = 1800
binaryOutput.singleFunctionPulseOnTripPoint.index = 9
binaryOutput.singleFunctionPulseOnTripPoint.count = 45
binaryOutput.singleFunctionPulseOnTripPoint.onTime.ms = 1900
binaryOutput.singleFunctionPulseOnTripPoint.offTime.ms = 2000

# 20 analog outputs: 0 takes 10, 1 takes 20, 10 to 19 take 10 or 70000
analogOutput.uninstalled.index = 65535
analogOutput.installedPoints = 10 ... 19
analogOutput.maxPointsInSingleRequest = 4
analogOutput.commands32Bit = true
analogOutput.index32Bit = 10
analogOutput.primary.valid.index = 0
analogOutput.primary.valid.value = 10
analogOutput.alternate.valid.index = 1
analogOutput.alternate.valid.value = 20

class.supportClass1 = true
class.numClass1EventsGenerated = 10
class.supportClass2 = true
class.numClass2EventsGenerated = 10
class.supportClass3 = true
class.numClass3EventsGenerated = 10

event.buffer.maxBinaryInputEvents = 200
event.buffer.maxAnalogInputEvents = 200
event.buffer.maxCounterEvents = 200
event.buffer.maxDoubleBitInputEvents = 200

behaviors.resetsLinkOnNack = false

timesync.supportSynchronizingTimeFromMaster = true
timesync.supportLanTimeSync = true
timesync.binaryInputChangeWithTime = true
timesync.binaryInputChangeWithRelativeTime = true
timesync.doubleBitInputChangeWithTime = true
timesync.doubleBitInputChangeWithRelativeTime = true
timesync.maxTimeFromResetToIIN14Ms = 5000
timesync.maxTimeBetweenSyncRequestsMs = 5000
timesync.timeToUnsynchronizedMs = 10000
timesync.timeWriteLatencyMs = 5

flag.tests.individualRemoteSupervisoryOutputIndex = 0
flag.tests.individualRemoteSupervisoryRemoteOutputIndex = 10

binaryInput.numEventsGenerated = 10
binaryInput.eventsClass = 1
binaryInput.defaultEventVariation = 2
doubleBitInput.numEventsGenerated = 10
doubleBitInput.eventsClass = 1
doubleBitInput.defaultEventVariation = 2
counter.numEventsGenerated = 10
counter.eventsClass = 2
analogInput.eventsClass = 3

unsolicited.unsolicitedConfirmTimeoutMs = 2000
unsolicited.otherMasterAddress = 2
unsolicited.hasMinNumEventsBeforeUnsolicited = false

supports.binaryInput = true
supports.disable.binaryInput = true
supports.binaryInputChangeEvents = true
supports.doubleBitInput = true
supports.disable.doubleBitInput = true
supports.doubleBitInputChangeEvents = true
supports.counter = true
supports.disable.counter = true
supports.counterChangeEvents = true
supports.frozenCounter = true
supports.disable.frozenCounter = true
supports.frozenCounterChangeEvents = true
supports.analogInput = true
supports.disable.analogInput = true
supports.analogInputChangeEvents = true
supports.binaryOutput.status = true
supports.binaryOutput.commands = true
supports.disable.binaryOutput = true
supports.binaryOutputChangeEvents = false
supports.binaryOutputCommandEvents = false
supports.analogOutput.status = true
supports.analogOutput.commands = true
supports.disable.analogOutput = true
supports.analogOutputChangeEvents = false
supports.analogOutputCommandEvents = false
# opendnp3 sends only unconfirmed link-layer frames
supports.dataLinkConfirmRequests = false
supports.dataLinkRetries = false
supports.selfAddress = false
supports.globalRemoteSupervisoryControl = true
supports.individualRemoteSupervisoryControl = true
supports.configurableFragmentSize = true
supports.unsolicitedResponse = true
# the outstation has no device attributes (group 0)
supports.deviceAttributes = false
supports.rangeReads = true

# analog inputs have a deadband of 1
analogInput.valueReturn.deadband = 1
# the classes of binary inputs at startup: 8 and 9 are in class 2, the others in class 1
class.assign.class1BinaryInputs = 0
class.assign.class2BinaryInputs = 8, 9
