[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "yadnp3"
version = "3.2.1.2"
description = "Python bindings for yadnp3 -- Yet Another opendnp3 fork (IEEE-1815 DNP3 protocol)"
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "f0rw4rd" }
]
keywords = [
    "dnp3",
    "ieee-1815",
    "scada",
    "protocol",
    "power-systems",
    "ics",
    "industrial-control",
    "outstation",
    "master"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",

    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/f0rw4rd/opendnp3"
Repository = "https://github.com/f0rw4rd/opendnp3"
Issues = "https://github.com/f0rw4rd/opendnp3/issues"

[tool.scikit-build]
cmake.source-dir = ".."
cmake.args = ["-DDNP3_PYTHON=ON", "-DDNP3_STATIC_LIBS=ON", "-DDNP3_TESTS=OFF"]
install.components = ["python"]
wheel.packages = ["../opendnp3"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-musllinux*"
test-command = 'python -c "import opendnp3; m = opendnp3.DNP3Manager(1); m.Shutdown(); print(\"yadnp3 OK\")"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-build = "yum install -y openssl-devel"

[tool.cibuildwheel.windows]
# Pinned to 3.x: OpenSSL 4 made asn1_string_st opaque, which the vendored
# asio 1.16 ssl headers (rfc2818_verification) cannot compile against.
before-build = "choco install --no-progress openssl --version=3.6.2 && pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.pytest.ini_options]
testpaths = ["tests"]
